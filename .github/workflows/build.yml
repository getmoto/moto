name: TestNDeploy

on: [push, pull_request]

concurrency:
  # PR runs share a group per PR, so a new commit cancels any in-progress runs.
  # Push runs get a unique group (run_id) so they never cancel/drop each other.
  # If several commits land close together on master, we want them all to run CI.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  cache:
    name: Caching
    # Every other job depends (transitively) on this one, so skipping it skips the whole run.
    # Run on: any PR; pushes to master on getmoto/moto; any push on a fork.
    # This allows pushes to forks to run CI, but prevents the double-CI problem for branches pushed
    # to the main repo that are opened as PRs (e.g. Dependabot).
    if: >-
      github.event_name == 'pull_request' ||
      github.repository != 'getmoto/moto' ||
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Get pip cache dir
        id: pip-cache-dir
        run: |
          echo "dir=$(pip cache dir)" >> $GITHUB_OUTPUT
      - name: pip cache
        id: pip-cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.pip-cache-dir.outputs.dir }}
          key: pip-${{ matrix.python-version }}-${{ hashFiles('**/setup.cfg') }}
      - name: Update pip
        if: ${{ steps.pip-cache.outputs.cache-hit != 'true' }}
        run: |
          python -m pip install --upgrade pip
      - name: Install project dependencies
        if: ${{ steps.pip-cache.outputs.cache-hit != 'true' }}
        run: |
          pip install -r requirements-dev.txt

  lint:
    name: Linting
    runs-on: ubuntu-latest
    needs: cache
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    # Retrieve the previously cached dependencies
    - name: Get pip cache dir
      id: pip-cache
      run: |
        echo "dir=$(pip cache dir)" >> $GITHUB_OUTPUT
    - name: pip cache
      uses: actions/cache@v6
      with:
        path: ${{ steps.pip-cache.outputs.dir }}
        key: pip-${{ matrix.python-version }}-${{ hashFiles('**/setup.cfg') }}
    # Update PIP
    - name: Update pip
      run: |
        python -m pip install --upgrade pip
    # Still need to properly install the dependencies - caching will only skip the download part
    - name: Install project dependencies
      run: |
        pip install -r requirements-dev.txt
    - name: Lint
      run: |
        mkdir .mypy_cache
        make lint

  buildserver:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # Retrieve the previously cached dependencies
      - name: Get pip cache dir
        id: pip-cache
        run: |
          echo "dir=$(pip cache dir)" >> $GITHUB_OUTPUT
      - name: pip cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.pip-cache.outputs.dir }}
          key: pip-${{ matrix.python-version }}-${{ hashFiles('**/setup.cfg') }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Docker Image
        uses: docker/build-push-action@v7
        with:
          tags: motoserver/moto:local
          outputs: type=docker,dest=/tmp/localimage.tar
          push: false
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: localimage
          path: /tmp/localimage.tar

  clitest:
    needs: buildserver
    uses: ./.github/workflows/tests_cli.yml

  cpptest:
    needs: buildserver
    uses: ./.github/workflows/tests_sdk_cpp.yml

  sagemaker_client_test:
    needs: lint
    uses: ./.github/workflows/tests_sdk_sagemaker.yml

  javatest:
    needs: buildserver
    uses: ./.github/workflows/tests_sdk_java.yml

  jstest:
    needs: buildserver
    uses: ./.github/workflows/tests_sdk_js.yml

  dotnettest:
    needs: buildserver
    uses: ./.github/workflows/tests_sdk_dotnet.yml

  rubytest:
    needs: buildserver
    uses: ./.github/workflows/tests_sdk_ruby.yml

  gotest:
    needs: buildserver
    uses: ./.github/workflows/tests_sdk_go.yml

  terraformexamplestest:
    needs: buildserver
    uses: ./.github/workflows/tests_terraform_examples.yml

  test:
    needs: [lint]
    if: "!contains(github.event.pull_request.labels.*.name, 'java')"
    uses: ./.github/workflows/tests_decoratormode.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  testserver:
    needs: [lint]
    if: "!contains(github.event.pull_request.labels.*.name, 'java')"
    uses: ./.github/workflows/tests_servermode.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  testproxy:
    needs: [lint]
    if: "!contains(github.event.pull_request.labels.*.name, 'java')"
    uses: ./.github/workflows/tests_proxymode.yml

  testcdk:
    needs: [buildserver]
    if: "!contains(github.event.pull_request.labels.*.name, 'java')"
    uses: ./.github/workflows/tests_cdk.yml
